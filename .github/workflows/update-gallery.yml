
name: Update photo gallery

on:
  push:
    branches:
      - main
    paths:
      - "content/projects/**"
      - "images/**"
      - "scripts/build_gallery.py"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-update
  cancel-in-progress: false

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build gallery
        run: python scripts/build_gallery.py

      - name: Check gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("gallery-data.json")
          projects = json.loads(path.read_text())

          print(f"Total gallery photos: {len(projects)}")

          for project in projects:
              print(
                  project.get("title"),
                  "-",
                  project.get("image")
              )
          PY

      - name: Commit updated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gallery-data.json

          if git diff --cached --quiet; then
            echo "Gallery already up to date"
          else
            git commit -m "Automatically update project gallery"
            git push origin HEAD:main
          fi
