
name: Update photo gallery

on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
      - 'scripts/build_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Generate gallery list
        run: python3 scripts/build_gallery.py

      - name: Publish gallery list
        run: |
          if ! git diff --quiet -- gallery-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gallery-data.json
            git commit -m "Update gallery data from Pages CMS"
            git push
          fi
